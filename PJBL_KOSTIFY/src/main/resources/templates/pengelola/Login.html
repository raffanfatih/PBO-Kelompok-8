<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Masuk Pengelola — Kostify</title>
    <link rel="stylesheet" th:href="@{/css/kostify.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--cream-bg);">

<div class="card" style="width:100%; max-width:430px; padding:34px;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;">
        <div style="width:44px; height:44px; border-radius:12px; background:var(--forest-900); color:#9EE0B9; display:flex; align-items:center; justify-content:center; font-size:20px;">
            <i class="fa-solid fa-house-chimney"></i>
        </div>
        <div>
            <div style="font-size:20px; font-weight:700; color:var(--forest-900);">Kostify</div>
            <div style="font-size:12.5px; color:var(--text-secondary);">Portal Pengelola Kos Griya Asri</div>
        </div>
    </div>

    <div th:if="${error}" style="background:var(--red-bg); color:var(--red-text); padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:16px;" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label class="form-label">Email Pengelola</label>
            <input type="email" name="email" class="form-control" value="admin@kostify.id" required>
        </div>
        <div class="form-group">
            <label class="form-label">Kata Sandi</label>
            <input type="password" name="password" class="form-control" value="admin123" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:6px;">
            Masuk ke Dashboard
        </button>
    </form>

    <div style="margin-top:22px; padding-top:16px; border-top:1px solid var(--border-soft); text-align:center; font-size:13px; color:var(--text-secondary);">
        Anda penghuni kos?
        <a th:href="@{/penghuni/login}" style="color:var(--forest-800); font-weight:600; text-decoration:none;">Masuk ke Portal Penghuni &rarr;</a>
    </div>
</div>

</body>
</html>
