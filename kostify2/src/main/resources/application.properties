spring.application.name=kostify2
server.port=8080

# Koneksi Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/kostify
spring.datasource.username=postgres
spring.datasource.password= isi pw postgres klean
spring.datasource.driver-class-name=org.postgresql.Driver

# Konfigurasi Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Cache dimatikan saat development agar perubahan HTML langsung terlihat
spring.thymeleaf.cache=false